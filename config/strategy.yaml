# Phase 2 strategy parameters — MA150 + ATR(14) trailing stop
# Loaded by SystemConfig at startup.  Values here are the single
# source of truth; the StrategyConfig dataclass mirrors them as defaults.

atr_length: 14
atr_mult: 3.0
slope_lookback: 20
entry_lookback: 20
atr_pct_high: 0.04
slope_min: 0.0

# Trading costs — wired to existing BacktestConfig plumbing.
# These values are NOT loaded separately; they are here for
# documentation only.  Override via BacktestConfig if needed.
costs:
  commission: 0.001      # BacktestConfig.commission_pct
  spread: 2.0            # BacktestConfig.spread_bps
  slippage: 3.0          # BacktestConfig.slippage_bps

risk_per_trade: 0.005    # Phase 4: fraction of equity risked per trade

# Phase 5: Volatility regime filter — ATR ratio + slope classification
volatility_regime:
  enabled: true
  atr_short: 14
  atr_long: 100
  quiet_threshold: 0.8
  expansion_threshold: 1.2
  extreme_threshold: 1.5
  slope_lookback: 10
  size_multipliers:
    quiet: 0.5
    normal: 1.0
    expanding: 0.5
    extreme: 0.0

# Phase 4 risk management — wired to BacktestConfig.
# Override via BacktestConfig if needed; values here for documentation.
risk_management:
  capital_base: 100000.0       # starting equity for backtest
  max_leverage: 1.0            # long-only; exposure <= 1.0 * equity
  max_position_pct: 0.25       # cap position notional to 25% equity
  min_stop_pct: 0.01           # avoid absurdly tiny stops (1% of price)
  max_stop_pct: 0.20           # avoid absurdly wide stops (20% of price)
