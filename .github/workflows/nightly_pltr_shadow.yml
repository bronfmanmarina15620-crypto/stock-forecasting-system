name: Nightly PLTR Shadow Run

on:
  schedule:
    # 21:00 UTC = 23:00 Israel (Asia/Jerusalem, IST = UTC+2 winter).
    # During DST (IDT = UTC+3, ~late Mar-late Oct) this fires at 00:00 local.
    # Stock-only (daily bars): no new data on Sat/Sun, skip weekend runs.
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  shadow-pltr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TICKER: PLTR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run shadow mode
        id: run
        run: |
          # Run pipeline, capture output for RUN_ID parsing.
          # Avoid set -o pipefail so grep/echo still execute on failure;
          # instead capture the exit code via PIPESTATUS.
          python run.py --ticker PLTR --mode shadow 2>&1 | tee /tmp/run_output.txt
          RUN_EXIT=${PIPESTATUS[0]}
          # Parse RUN_ID from stdout (run.py prints "RUN_ID=<id>")
          RUN_ID=$(grep -m1 '^RUN_ID=' /tmp/run_output.txt | cut -d= -f2 || true)
          echo "run_id=${RUN_ID:-na}" >> "$GITHUB_OUTPUT"
          exit "$RUN_EXIT"

      - name: Read shadow summary
        id: shadow
        run: |
          RUN_ID="${{ steps.run.outputs.run_id }}"
          RUN_DIR="runs/PLTR/${RUN_ID}"
          SUMMARY="${RUN_DIR}/ShadowMonitorAgent/shadow_summary.json"
          if [ -f "$SUMMARY" ]; then
            DECISION=$(python3 -c "import json; print(json.load(open('${SUMMARY}')).get('decision','UNKNOWN'))")
            REGIME=$(python3 -c "import json; print(json.load(open('${SUMMARY}')).get('regime_label','na'))")
          else
            DECISION="UNKNOWN"
            REGIME="na"
          fi
          # Read drift summary if present (|| echo "na" guards corrupt JSON)
          DRIFT="${RUN_DIR}/DriftAgent/drift_summary.json"
          if [ -f "$DRIFT" ]; then
            DRIFT_STATUS=$(python3 -c "import json; print(json.load(open('${DRIFT}')).get('drift_status','na'))" || echo "na")
            DRIFT_FLAG=$(python3 -c "import json; print(json.load(open('${DRIFT}')).get('overall_drift_flag','na'))" || echo "na")
            DRIFT_USED=$(python3 -c "import json; print(json.load(open('${DRIFT}')).get('runs_used_in_window','na'))" || echo "na")
            DRIFT_ELIGIBLE=$(python3 -c "import json; print(json.load(open('${DRIFT}')).get('eligible_runs_found','na'))" || echo "na")
            DRIFT_SCANNED=$(python3 -c "import json; print(json.load(open('${DRIFT}')).get('total_runs_scanned','na'))" || echo "na")
            DRIFT_REASON=$(python3 -c "import json; print(json.load(open('${DRIFT}')).get('drift_reason_summary','na'))" || echo "na")
          else
            DRIFT_STATUS="na"
            DRIFT_FLAG="na"
            DRIFT_USED="na"
            DRIFT_ELIGIBLE="na"
            DRIFT_SCANNED="na"
            DRIFT_REASON="na"
          fi
          echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"
          echo "regime=${REGIME}" >> "$GITHUB_OUTPUT"
          echo "run_dir=${RUN_DIR}" >> "$GITHUB_OUTPUT"
          echo "drift_status=${DRIFT_STATUS}" >> "$GITHUB_OUTPUT"
          echo "drift_flag=${DRIFT_FLAG}" >> "$GITHUB_OUTPUT"
          echo "drift_used=${DRIFT_USED}" >> "$GITHUB_OUTPUT"
          echo "drift_eligible=${DRIFT_ELIGIBLE}" >> "$GITHUB_OUTPUT"
          echo "drift_scanned=${DRIFT_SCANNED}" >> "$GITHUB_OUTPUT"
          echo "drift_reason=${DRIFT_REASON}" >> "$GITHUB_OUTPUT"
          # Read edge summary if present
          EDGE="${RUN_DIR}/edge_summary.json"
          if [ -f "$EDGE" ]; then
            EDGE_PASS=$(python3 -c "import json; e=json.load(open('${EDGE}')); print('PASS' if e.get('edge_pass') else 'FAIL')" || echo "na")
            EDGE_EXIT_CODE=$(python3 -c "import json; print(json.load(open('${EDGE}')).get('exit_code',2))" || echo "2")
            EDGE_N=$(python3 -c "import json; print(json.load(open('${EDGE}')).get('N',0))" || echo "0")
            EDGE_E=$(python3 -c "import json; print(round(json.load(open('${EDGE}')).get('expectancy',0.0),4))" || echo "0")
            EDGE_PF=$(python3 -c "import json; print(round(json.load(open('${EDGE}')).get('pf',0.0),4))" || echo "0")
            EDGE_MDD=$(python3 -c "import json; print(round(json.load(open('${EDGE}')).get('mdd_r',0.0),4))" || echo "0")
            FAILURE_CLASS=$(python3 -c "import json; print(json.load(open('${EDGE}')).get('failure_class','UNKNOWN'))" || echo "UNKNOWN")
            EDGE_CONFIG_LOADED=$(python3 -c "import json; print(str(json.load(open('${EDGE}')).get('edge_config_loaded',False)).lower())" || echo "false")
          else
            EDGE_PASS="na"; EDGE_EXIT_CODE="2"; EDGE_N="0"; EDGE_E="0"; EDGE_PF="0"; EDGE_MDD="0"
            FAILURE_CLASS="EDGE_SUMMARY_MISSING"; EDGE_CONFIG_LOADED="false"
          fi
          echo "edge_pass=${EDGE_PASS}" >> "$GITHUB_OUTPUT"
          echo "edge_exit_code=${EDGE_EXIT_CODE}" >> "$GITHUB_OUTPUT"
          echo "edge_n=${EDGE_N}" >> "$GITHUB_OUTPUT"
          echo "edge_e=${EDGE_E}" >> "$GITHUB_OUTPUT"
          echo "edge_pf=${EDGE_PF}" >> "$GITHUB_OUTPUT"
          echo "edge_mdd=${EDGE_MDD}" >> "$GITHUB_OUTPUT"
          echo "failure_class=${FAILURE_CLASS}" >> "$GITHUB_OUTPUT"
          echo "edge_config_loaded=${EDGE_CONFIG_LOADED}" >> "$GITHUB_OUTPUT"

      - name: Validate run
        id: validate
        run: |
          python validate_run.py --run ${{ steps.shadow.outputs.run_dir }}

      - name: Notify Telegram on success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_ID="${{ steps.run.outputs.run_id }}"
          DECISION="${{ steps.shadow.outputs.decision }}"
          REGIME="${{ steps.shadow.outputs.regime }}"
          DRIFT_STATUS="${{ steps.shadow.outputs.drift_status }}"
          DRIFT_FLAG="${{ steps.shadow.outputs.drift_flag }}"
          DRIFT_USED="${{ steps.shadow.outputs.drift_used }}"
          DRIFT_ELIGIBLE="${{ steps.shadow.outputs.drift_eligible }}"
          DRIFT_SCANNED="${{ steps.shadow.outputs.drift_scanned }}"
          DRIFT_REASON="${{ steps.shadow.outputs.drift_reason }}"
          EDGE_PASS="${{ steps.shadow.outputs.edge_pass }}"
          EDGE_N="${{ steps.shadow.outputs.edge_n }}"
          EDGE_E="${{ steps.shadow.outputs.edge_e }}"
          EDGE_PF="${{ steps.shadow.outputs.edge_pf }}"
          EDGE_MDD="${{ steps.shadow.outputs.edge_mdd }}"
          # Include drift info only if DriftAgent ran
          if [ "$DRIFT_STATUS" != "na" ]; then
            DRIFT_PART=" | DRIFT=${DRIFT_STATUS}/${DRIFT_FLAG} COVERAGE=${DRIFT_USED}/${DRIFT_ELIGIBLE} SCANNED=${DRIFT_SCANNED} REASON=${DRIFT_REASON}"
          else
            DRIFT_PART=""
          fi
          TEXT=$(printf '\xe2\x9c\x85 SHADOW OK | PLTR | RUN_ID=%s | DECISION=%s | REGIME=%s | Edge: PASS exit=0 N=%s E=%s PF=%s MDD_R=%s%s' \
            "$RUN_ID" "$DECISION" "$REGIME" "$EDGE_N" "$EDGE_E" "$EDGE_PF" "$EDGE_MDD" "$DRIFT_PART")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" || true

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_ID="${{ steps.run.outputs.run_id }}"
          # Determine which step failed (fixed values, uppercase)
          if [ "${{ steps.run.outcome }}" = "failure" ]; then
            STEP_NAME="RUN"
          elif [ "${{ steps.validate.outcome }}" = "failure" ]; then
            STEP_NAME="VALIDATE"
          else
            STEP_NAME="UNKNOWN"
          fi
          # Safety: only log token length + last 3 chars of chat id
          TOKEN_LEN=${#TELEGRAM_BOT_TOKEN}
          CHAT_TAIL="${TELEGRAM_CHAT_ID: -3}"
          echo "Telegram token length: ${TOKEN_LEN}, chat_id tail: ...${CHAT_TAIL}"
          FAILURE_CLASS="${{ steps.shadow.outputs.failure_class }}"
          FAILURE_CLASS="${FAILURE_CLASS:-UNKNOWN}"
          EDGE_EXIT_CODE="${{ steps.shadow.outputs.edge_exit_code }}"
          EDGE_EXIT_CODE="${EDGE_EXIT_CODE:-2}"
          EDGE_N="${{ steps.shadow.outputs.edge_n }}"
          EDGE_E="${{ steps.shadow.outputs.edge_e }}"
          EDGE_PF="${{ steps.shadow.outputs.edge_pf }}"
          EDGE_MDD="${{ steps.shadow.outputs.edge_mdd }}"
          # Build fix hint based on failure_class
          FIX_HINT=""
          if [ "$FAILURE_CLASS" = "MISSING_CONFIG" ]; then
            FIX_HINT=" | Fix: ensure config/edge.yaml exists on main (not ignored) and is packaged in the repo."
          elif [ "$FAILURE_CLASS" = "MISSING_ARTIFACTS" ]; then
            FIX_HINT=" | Fix: validate_run step before edge must produce trades.parquet + robustness artifacts."
          elif [ "$FAILURE_CLASS" = "EDGE_SUMMARY_MISSING" ]; then
            FIX_HINT=" | Fix: edge_summary.json not produced; check run.py edge validation persistence and validation order."
          fi
          TEXT=$(printf '\xe2\x9d\x8c SHADOW FAIL | PLTR | RUN_ID=%s | STEP=%s | Edge: %s exit=%s N=%s E=%s PF=%s MDD_R=%s%s' \
            "${RUN_ID:-na}" "$STEP_NAME" "$FAILURE_CLASS" "$EDGE_EXIT_CODE" "$EDGE_N" "$EDGE_E" "$EDGE_PF" "$EDGE_MDD" "$FIX_HINT")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" || true
