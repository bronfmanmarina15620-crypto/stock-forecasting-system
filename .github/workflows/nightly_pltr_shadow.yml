name: Nightly PLTR Shadow Run

on:
  schedule:
    # 21:00 UTC = 23:00 Israel (Asia/Jerusalem, IST = UTC+2 winter).
    # During DST (IDT = UTC+3, ~late Mar-late Oct) this fires at 00:00 local.
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  shadow-pltr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TICKER: PLTR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run shadow mode
        id: run
        run: |
          # Run pipeline, capture output for RUN_ID parsing.
          # Avoid set -o pipefail so grep/echo still execute on failure;
          # instead capture the exit code via PIPESTATUS.
          python run.py --ticker PLTR --mode shadow 2>&1 | tee /tmp/run_output.txt
          RUN_EXIT=${PIPESTATUS[0]}
          # Parse RUN_ID from stdout (run.py prints "RUN_ID=<id>")
          RUN_ID=$(grep -m1 '^RUN_ID=' /tmp/run_output.txt | cut -d= -f2 || true)
          echo "run_id=${RUN_ID:-na}" >> "$GITHUB_OUTPUT"
          exit "$RUN_EXIT"

      - name: Read shadow summary
        id: shadow
        run: |
          RUN_ID="${{ steps.run.outputs.run_id }}"
          RUN_DIR="runs/PLTR/${RUN_ID}"
          SUMMARY="${RUN_DIR}/ShadowMonitorAgent/shadow_summary.json"
          if [ -f "$SUMMARY" ]; then
            DECISION=$(python3 -c "import json; print(json.load(open('${SUMMARY}')).get('decision','UNKNOWN'))")
            REGIME=$(python3 -c "import json; print(json.load(open('${SUMMARY}')).get('regime_label','na'))")
          else
            DECISION="UNKNOWN"
            REGIME="na"
          fi
          # Read drift summary if present (|| echo "na" guards corrupt JSON)
          DRIFT="${RUN_DIR}/DriftAgent/drift_summary.json"
          if [ -f "$DRIFT" ]; then
            DRIFT_STATUS=$(python3 -c "import json; print(json.load(open('${DRIFT}')).get('drift_status','na'))" || echo "na")
            DRIFT_FLAG=$(python3 -c "import json; print(json.load(open('${DRIFT}')).get('overall_drift_flag','na'))" || echo "na")
            DRIFT_USED=$(python3 -c "import json; print(json.load(open('${DRIFT}')).get('runs_used_in_window','na'))" || echo "na")
            DRIFT_ELIGIBLE=$(python3 -c "import json; print(json.load(open('${DRIFT}')).get('eligible_runs_found','na'))" || echo "na")
            DRIFT_SCANNED=$(python3 -c "import json; print(json.load(open('${DRIFT}')).get('total_runs_scanned','na'))" || echo "na")
            DRIFT_REASON=$(python3 -c "import json; print(json.load(open('${DRIFT}')).get('drift_reason_summary','na'))" || echo "na")
          else
            DRIFT_STATUS="na"
            DRIFT_FLAG="na"
            DRIFT_USED="na"
            DRIFT_ELIGIBLE="na"
            DRIFT_SCANNED="na"
            DRIFT_REASON="na"
          fi
          echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"
          echo "regime=${REGIME}" >> "$GITHUB_OUTPUT"
          echo "run_dir=${RUN_DIR}" >> "$GITHUB_OUTPUT"
          echo "drift_status=${DRIFT_STATUS}" >> "$GITHUB_OUTPUT"
          echo "drift_flag=${DRIFT_FLAG}" >> "$GITHUB_OUTPUT"
          echo "drift_used=${DRIFT_USED}" >> "$GITHUB_OUTPUT"
          echo "drift_eligible=${DRIFT_ELIGIBLE}" >> "$GITHUB_OUTPUT"
          echo "drift_scanned=${DRIFT_SCANNED}" >> "$GITHUB_OUTPUT"
          echo "drift_reason=${DRIFT_REASON}" >> "$GITHUB_OUTPUT"

      - name: Validate run
        id: validate
        run: |
          python validate_run.py --run ${{ steps.shadow.outputs.run_dir }}

      - name: Notify Telegram on success
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_ID="${{ steps.run.outputs.run_id }}"
          DECISION="${{ steps.shadow.outputs.decision }}"
          REGIME="${{ steps.shadow.outputs.regime }}"
          DRIFT_STATUS="${{ steps.shadow.outputs.drift_status }}"
          DRIFT_FLAG="${{ steps.shadow.outputs.drift_flag }}"
          DRIFT_USED="${{ steps.shadow.outputs.drift_used }}"
          DRIFT_ELIGIBLE="${{ steps.shadow.outputs.drift_eligible }}"
          DRIFT_SCANNED="${{ steps.shadow.outputs.drift_scanned }}"
          DRIFT_REASON="${{ steps.shadow.outputs.drift_reason }}"
          # Include drift info only if DriftAgent ran
          if [ "$DRIFT_STATUS" != "na" ]; then
            DRIFT_PART=" | DRIFT=${DRIFT_STATUS}/${DRIFT_FLAG} COVERAGE=${DRIFT_USED}/${DRIFT_ELIGIBLE} SCANNED=${DRIFT_SCANNED} REASON=${DRIFT_REASON}"
          else
            DRIFT_PART=""
          fi
          TEXT=$(printf '\xe2\x9c\x85 SHADOW OK | PLTR | RUN_ID=%s | DECISION=%s | REGIME=%s%s' \
            "$RUN_ID" "$DECISION" "$REGIME" "$DRIFT_PART")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" || true

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_ID="${{ steps.run.outputs.run_id }}"
          # Determine which step failed (fixed values, uppercase)
          if [ "${{ steps.run.outcome }}" = "failure" ]; then
            STEP_NAME="RUN"
          elif [ "${{ steps.validate.outcome }}" = "failure" ]; then
            STEP_NAME="VALIDATE"
          else
            STEP_NAME="UNKNOWN"
          fi
          # Safety: only log token length + last 3 chars of chat id
          TOKEN_LEN=${#TELEGRAM_BOT_TOKEN}
          CHAT_TAIL="${TELEGRAM_CHAT_ID: -3}"
          echo "Telegram token length: ${TOKEN_LEN}, chat_id tail: ...${CHAT_TAIL}"
          TEXT=$(printf '\xe2\x9d\x8c SHADOW FAIL | PLTR | RUN_ID=%s | STEP=%s' \
            "${RUN_ID:-na}" "$STEP_NAME")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" || true
