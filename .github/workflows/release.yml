name: Release Gate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.0)"
        required: true
      notes:
        description: "Release notes (optional)"
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Run smoke test
        run: bash scripts/ci_smoke_run.sh PLTR

      - name: Release instructions
        run: |
          echo "============================================================"
          echo "RELEASE GATE PASSED"
          echo "============================================================"
          echo ""
          echo "Tests and smoke-run passed. To create the release:"
          echo ""
          echo "  git tag -a ${{ github.event.inputs.tag }} -m \"${{ github.event.inputs.notes }}\""
          echo "  git push origin ${{ github.event.inputs.tag }}"
          echo "  gh release create ${{ github.event.inputs.tag }} --title \"${{ github.event.inputs.tag }}\" --notes \"${{ github.event.inputs.notes }}\""
          echo ""
          echo "============================================================"
