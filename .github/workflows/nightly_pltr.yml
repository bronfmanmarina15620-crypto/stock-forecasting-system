name: Nightly PLTR Run

on:
  schedule:
    - cron: '0 20 * * *'   # 23:00 Israel Summer (IDT, UTC+3)
    - cron: '0 21 * * *'   # 23:00 Israel Winter (IST, UTC+2)
  workflow_dispatch:

jobs:
  run-pltr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TICKER: PLTR
      PYTHONHASHSEED: "0"
      TZ: "UTC"

    steps:
      - name: DST guard – only run at 23:00 Israel time
        if: github.event_name == 'schedule'
        run: |
          ISRAEL_HOUR=$(TZ=Asia/Jerusalem date +%-H)
          if [ "$ISRAEL_HOUR" -ne 23 ]; then
            echo "::notice::Israel hour is $ISRAEL_HOUR, not 23 – skipping DST-mismatched trigger"
            echo "SKIP_RUN=true" >> "$GITHUB_ENV"
          fi

      - name: Checkout
        if: env.SKIP_RUN != 'true'
        uses: actions/checkout@v4

      - name: Record start time
        if: env.SKIP_RUN != 'true'
        run: echo "START_TIME=$(date '+%d/%m/%Y %H:%M UTC')" >> $GITHUB_ENV

      - name: Set up Python
        if: env.SKIP_RUN != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: env.SKIP_RUN != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run system (PLTR)
        if: env.SKIP_RUN != 'true'
        run: python run.py --ticker PLTR

      - name: Find latest run folder and read summary
        if: env.SKIP_RUN != 'true'
        id: latest
        run: |
          LATEST_DIR=$(ls -dt runs/PLTR/* | head -n 1)
          echo "latest_dir=$LATEST_DIR" >> $GITHUB_OUTPUT
          SUMMARY="${LATEST_DIR}/run_summary.json"
          if [ ! -f "$SUMMARY" ]; then
            echo "::error::run_summary.json not found in $LATEST_DIR"
            exit 1
          fi
          python3 -c "
          import json
          s = json.load(open('${SUMMARY}'))
          print('run_id=' + s.get('run_id', 'UNKNOWN'))
          print('decision=' + s.get('decision', 'UNKNOWN'))
          print('has_trade=' + str(s.get('has_trade', False)).lower())
          " >> $GITHUB_OUTPUT
          echo "Latest run dir: $LATEST_DIR"

      - name: Validate run
        if: env.SKIP_RUN != 'true'
        run: |
          python validate_run.py --run ${{ steps.latest.outputs.latest_dir }}

      - name: Upload reports (artifact)
        if: env.SKIP_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pltr_reports_${{ github.run_id }}
          path: |
            ${{ steps.latest.outputs.latest_dir }}/final_report.html
            ${{ steps.latest.outputs.latest_dir }}/final_report.json
            ${{ steps.latest.outputs.latest_dir }}/status.json
            ${{ steps.latest.outputs.latest_dir }}/status.txt
            ${{ steps.latest.outputs.latest_dir }}/_meta.json
            ${{ steps.latest.outputs.latest_dir }}/run_summary.json
            ${{ steps.latest.outputs.latest_dir }}/config_snapshot.yaml
            ${{ steps.latest.outputs.latest_dir }}/BacktestAgent/metrics.json
            ${{ steps.latest.outputs.latest_dir }}/BacktestAgent/sanity_tests.json
            ${{ steps.latest.outputs.latest_dir }}/DecisionRiskAgent/abstain_stats.json
            ${{ steps.latest.outputs.latest_dir }}/DecisionRiskAgent/decision_action.json
          if-no-files-found: error

      - name: Log success
        if: success() && env.SKIP_RUN != 'true'
        run: |
          echo "SUCCESS: PLTR nightly run completed at $(date '+%d/%m/%Y %H:%M UTC')"

      - name: Notify Telegram on success
        if: success() && github.event_name == 'schedule' && env.SKIP_RUN != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_ID="${{ steps.latest.outputs.run_id }}"
          DECISION="${{ steps.latest.outputs.decision }}"
          HAS_TRADE="${{ steps.latest.outputs.has_trade }}"
          TEXT=$'✅ Nightly run SUCCESS\nTicker: PLTR\nRUN_ID: '"${RUN_ID}"$'\nCommit: '"${SHORT_SHA}"$'\nDecision: '"${DECISION}"$'\nHasTrade: '"${HAS_TRADE}"$'\nActions: '"${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" || true

      - name: Notify Telegram on failure
        if: failure() && env.SKIP_RUN != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          END_TIME=$(date '+%d/%m/%Y %H:%M UTC')
          TEXT="PLTR nightly run FAILED"$'\n'"Start: ${START_TIME}"$'\n'"End:   ${END_TIME}"$'\n'"${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" || true
