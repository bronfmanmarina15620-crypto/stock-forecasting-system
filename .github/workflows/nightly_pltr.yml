name: Nightly PLTR Run

on:
  schedule:
    # Stock-only (daily bars): no new data on Sat/Sun, skip weekend runs.
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-pltr:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TICKER: PLTR
      PYTHONHASHSEED: "0"
      TZ: "UTC"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Record start time
        run: echo "START_TIME=$(date '+%d/%m/%Y %H:%M UTC')" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compute as-of date
        id: asof
        run: echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Run system (PLTR)
        run: python run.py --ticker PLTR --as-of ${{ steps.asof.outputs.date }}

      - name: Find latest run folder and read summary
        id: latest
        run: |
          LATEST_DIR=$(ls -dt runs/PLTR/* | head -n 1)
          echo "latest_dir=$LATEST_DIR" >> $GITHUB_OUTPUT
          SUMMARY="${LATEST_DIR}/run_summary.json"
          if [ ! -f "$SUMMARY" ]; then
            echo "::error::run_summary.json not found in $LATEST_DIR"
            exit 1
          fi
          python3 -c "
          import json
          s = json.load(open('${SUMMARY}'))
          print('run_id=' + s.get('run_id', 'UNKNOWN'))
          print('decision=' + s.get('decision', 'UNKNOWN'))
          print('has_trade=' + str(s.get('has_trade', False)).lower())
          " >> $GITHUB_OUTPUT
          # Read edge summary if present
          EDGE="${LATEST_DIR}/edge_summary.json"
          if [ -f "$EDGE" ]; then
            python3 -c "
          import json
          e = json.load(open('${EDGE}'))
          print('edge_pass=' + ('PASS' if e.get('edge_pass') else 'FAIL'))
          print('edge_exit_code=' + str(e.get('exit_code', 2)))
          print('edge_n=' + str(e.get('N', 0)))
          print('edge_e=' + str(round(e.get('expectancy', 0.0), 4)))
          print('edge_pf=' + str(round(e.get('pf', 0.0), 4)))
          print('edge_mdd=' + str(round(e.get('mdd_r', 0.0), 4)))
          print('failure_class=' + str(e.get('failure_class', 'UNKNOWN')))
          print('edge_config_loaded=' + str(e.get('edge_config_loaded', False)).lower())
          " >> $GITHUB_OUTPUT
          else
            echo "edge_pass=na" >> $GITHUB_OUTPUT
            echo "edge_exit_code=2" >> $GITHUB_OUTPUT
            echo "edge_n=0" >> $GITHUB_OUTPUT
            echo "edge_e=0" >> $GITHUB_OUTPUT
            echo "edge_pf=0" >> $GITHUB_OUTPUT
            echo "edge_mdd=0" >> $GITHUB_OUTPUT
            echo "failure_class=EDGE_SUMMARY_MISSING" >> $GITHUB_OUTPUT
            echo "edge_config_loaded=false" >> $GITHUB_OUTPUT
          fi
          echo "Latest run dir: $LATEST_DIR"

      - name: Validate run
        run: |
          python validate_run.py --run ${{ steps.latest.outputs.latest_dir }}

      - name: Replay parity check
        id: parity
        run: |
          RUN_A="${{ steps.latest.outputs.latest_dir }}"
          echo "Running replay from $RUN_A ..."
          python run.py --ticker PLTR --as-of ${{ steps.asof.outputs.date }} --replay-from "$RUN_A"
          RUN_B=$(ls -dt runs/PLTR/* | head -n 1)
          echo "replay_dir=$RUN_B" >> $GITHUB_OUTPUT
          echo "Validating replay run (structural, --skip-edge) ..."
          python validate_run.py --run "$RUN_B" --skip-edge
          echo "Comparing runs for parity ..."
          python tools/compare_runs.py "$RUN_A" "$RUN_B"

      - name: Upload reports (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pltr_reports_${{ github.run_id }}
          path: |
            ${{ steps.latest.outputs.latest_dir }}/final_report.html
            ${{ steps.latest.outputs.latest_dir }}/final_report.json
            ${{ steps.latest.outputs.latest_dir }}/status.json
            ${{ steps.latest.outputs.latest_dir }}/status.txt
            ${{ steps.latest.outputs.latest_dir }}/_meta.json
            ${{ steps.latest.outputs.latest_dir }}/run_summary.json
            ${{ steps.latest.outputs.latest_dir }}/config_snapshot.yaml
            ${{ steps.latest.outputs.latest_dir }}/BacktestAgent/metrics.json
            ${{ steps.latest.outputs.latest_dir }}/BacktestAgent/sanity_tests.json
            ${{ steps.latest.outputs.latest_dir }}/DecisionRiskAgent/abstain_stats.json
            ${{ steps.latest.outputs.latest_dir }}/DecisionRiskAgent/decision_action.json
            ${{ steps.latest.outputs.latest_dir }}/edge_summary.json
            ${{ steps.latest.outputs.latest_dir }}/edge_report.txt
          if-no-files-found: error

      - name: Log success
        if: ${{ success() }}
        run: |
          echo "SUCCESS: PLTR nightly run completed at $(date '+%d/%m/%Y %H:%M UTC')"

      - name: Notify Telegram on success
        if: success() && github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RUN_ID="${{ steps.latest.outputs.run_id }}"
          DECISION="${{ steps.latest.outputs.decision }}"
          HAS_TRADE="${{ steps.latest.outputs.has_trade }}"
          EDGE_PASS="${{ steps.latest.outputs.edge_pass }}"
          EDGE_N="${{ steps.latest.outputs.edge_n }}"
          EDGE_E="${{ steps.latest.outputs.edge_e }}"
          EDGE_PF="${{ steps.latest.outputs.edge_pf }}"
          EDGE_MDD="${{ steps.latest.outputs.edge_mdd }}"
          TEXT=$'✅ Nightly run SUCCESS\nTicker: PLTR\nRUN_ID: '"${RUN_ID}"$'\nCommit: '"${SHORT_SHA}"$'\nDecision: '"${DECISION}"$'\nHasTrade: '"${HAS_TRADE}"$'\nEdge: PASS exit=0 N='"${EDGE_N}"' E='"${EDGE_E}"' PF='"${EDGE_PF}"' MDD_R='"${EDGE_MDD}"$'\nActions: '"${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" || true

      - name: Notify Telegram on failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          END_TIME=$(date '+%d/%m/%Y %H:%M UTC')
          FAILURE_CLASS="${{ steps.latest.outputs.failure_class }}"
          FAILURE_CLASS="${FAILURE_CLASS:-UNKNOWN}"
          EDGE_EXIT_CODE="${{ steps.latest.outputs.edge_exit_code }}"
          EDGE_EXIT_CODE="${EDGE_EXIT_CODE:-2}"
          EDGE_N="${{ steps.latest.outputs.edge_n }}"
          EDGE_E="${{ steps.latest.outputs.edge_e }}"
          EDGE_PF="${{ steps.latest.outputs.edge_pf }}"
          EDGE_MDD="${{ steps.latest.outputs.edge_mdd }}"
          # Build fix hint based on failure_class
          FIX_HINT=""
          if [ "$FAILURE_CLASS" = "MISSING_CONFIG" ]; then
            FIX_HINT=$'\nFix: ensure config/edge.yaml exists on main (not ignored) and is packaged in the repo.'
          elif [ "$FAILURE_CLASS" = "MISSING_ARTIFACTS" ]; then
            FIX_HINT=$'\nFix: validate_run step before edge must produce trades.parquet + robustness artifacts.'
          elif [ "$FAILURE_CLASS" = "EDGE_SUMMARY_MISSING" ]; then
            FIX_HINT=$'\nFix: edge_summary.json not produced; check run.py edge validation persistence and validation order.'
          fi
          TEXT="PLTR nightly run FAILED"$'\n'"Start: ${START_TIME}"$'\n'"End:   ${END_TIME}"$'\n'"Edge: ${FAILURE_CLASS} exit=${EDGE_EXIT_CODE} N=${EDGE_N} E=${EDGE_E} PF=${EDGE_PF} MDD_R=${EDGE_MDD}${FIX_HINT}"$'\n'"${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" || true
