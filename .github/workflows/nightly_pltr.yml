name: Nightly PLTR Run

on:
  schedule:
    # 21:00 UTC ~= 23:00 Israel (winter time). Adjust when DST changes.
    - cron: "0 21 * * *"
  workflow_dispatch: {}

jobs:
  run-pltr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TICKER: PLTR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record start time
        run: echo "START_TIME=$(date '+%d/%m/%Y %H:%M UTC')" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run system (PLTR)
        run: |
          python run.py --ticker PLTR

      - name: Find latest run folder
        id: latest
        run: |
          LATEST_DIR=$(ls -dt runs/PLTR/* | head -n 1)
          echo "latest_dir=$LATEST_DIR" >> $GITHUB_OUTPUT
          echo "Latest run dir: $LATEST_DIR"

      - name: Validate run
        run: |
          python validate_run.py --run ${{ steps.latest.outputs.latest_dir }}

      - name: Upload reports (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: pltr_reports_${{ github.run_id }}
          path: |
            ${{ steps.latest.outputs.latest_dir }}/final_report.html
            ${{ steps.latest.outputs.latest_dir }}/final_report.json
            ${{ steps.latest.outputs.latest_dir }}/status.json
            ${{ steps.latest.outputs.latest_dir }}/status.txt
            ${{ steps.latest.outputs.latest_dir }}/config_snapshot.yaml
            ${{ steps.latest.outputs.latest_dir }}/BacktestAgent/metrics.json
            ${{ steps.latest.outputs.latest_dir }}/BacktestAgent/sanity_tests.json
            ${{ steps.latest.outputs.latest_dir }}/DecisionRiskAgent/abstain_stats.json
            ${{ steps.latest.outputs.latest_dir }}/DecisionRiskAgent/decision_action.json
          if-no-files-found: error

      - name: Log success
        if: ${{ success() }}
        run: |
          echo "SUCCESS: PLTR nightly run completed at $(date '+%d/%m/%Y %H:%M UTC')"

      - name: Notify Telegram on failure
        if: ${{ failure() }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          END_TIME=$(date '+%d/%m/%Y %H:%M UTC')
          TEXT="PLTR nightly run FAILED"$'\n'"Start: ${START_TIME}"$'\n'"End:   ${END_TIME}"$'\n'"${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" || true
